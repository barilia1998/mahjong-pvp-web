<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mahjong Web PvP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-table">
    <!-- Header Status & Indikator Timer Global -->
    <div id="header-bar">
      <div id="status-bar">Menghubungkan ke server...</div>
      <div id="turn-timer" class="timer-box">Waktu: <span id="timer-count">15</span>s</div>
    </div>

    <!-- Kursi Lawan Atas (Pemain 3 / Indeks 2) -->
    <div id="seat-top" class="player-seat">
      <div class="player-info" id="label-top">Pemain 3 (Atas)</div>
      <div id="hand-top" class="opponent-hand horizontal-back"></div>
    </div>

    <!-- Area Meja Tengah -->
    <div id="middle-board">
      <!-- Kursi Lawan Kiri (Pemain 4 / Indeks 3) -->
      <div id="seat-left" class="player-seat">
        <div class="player-info" id="label-left">Pemain 4 (Kiri)</div>
        <div id="hand-left" class="opponent-hand vertical-back"></div>
      </div>

      <!-- Area Buangan Bersama -->
      <div id="discard-pond">
        <div class="section-title">Area Buangan</div>
        <div id="discard-tiles" class="discard-grid"></div>
      </div>

      <!-- Kursi Lawan Kanan (Pemain 2 / Indeks 1) -->
      <div id="seat-right" class="player-seat">
        <div class="player-info" id="label-right">Pemain 2 (Kanan)</div>
        <div id="hand-right" class="opponent-hand vertical-back"></div>
      </div>
    </div>

    <!-- Tombol Aksi Permainan -->
    <div id="action-controls">
      <button id="btn-chow" class="btn btn-action" onclick="claimAction('CHOW')">CHOW</button>
      <button id="btn-pung" class="btn btn-action" onclick="claimAction('PUNG')">PUNG</button>
      <button id="btn-kong" class="btn btn-action" onclick="claimAction('KONG')">KONG</button>
      <button id="btn-win" class="btn btn-win" onclick="claimAction('HU')">HU</button>
    </div>

    <!-- Kursi Anda (Bawah / Indeks 0) -->
    <div id="seat-bottom" class="player-seat active-turn">
      <div class="player-info" id="label-bottom">Giliran Anda (Bawah)</div>
      <div id="player-hand" class="tile-row"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
