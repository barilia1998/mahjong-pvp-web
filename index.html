<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mahjong PvP Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-table">
    <!-- Header: Status dan Timer -->
    <header id="header-bar">
      <div id="status-bar">Menghubungkan ke server...</div>
      <div id="turn-timer" class="timer-box"><span id="timer-count">15</span>s</div>
    </header>

    <!-- Lawan Atas -->
    <div id="seat-top" class="player-seat">
      <div class="player-info" id="label-top">Pemain 3 (Atas)</div>
      <div id="hand-top" class="opponent-hand horizontal-back"></div>
    </div>

    <!-- Area Meja Tengah -->
    <main id="middle-board">
      <!-- Lawan Kiri -->
      <div id="seat-left" class="player-seat side-seat">
        <div class="player-info" id="label-left">P4</div>
        <div id="hand-left" class="opponent-hand vertical-back"></div>
      </div>

      <!-- Area Buangan -->
      <div id="discard-pond">
        <div class="section-title">Buangan</div>
        <div id="discard-tiles" class="discard-grid"></div>
      </div>

      <!-- Lawan Kanan -->
      <div id="seat-right" class="player-seat side-seat">
        <div class="player-info" id="label-right">P2</div>
        <div id="hand-right" class="opponent-hand vertical-back"></div>
      </div>
    </main>

    <!-- Tombol Aksi -->
    <div id="action-controls">
      <button id="btn-sort" class="btn btn-secondary" onclick="sortMyHand()">URUTKAN</button>
      <button id="btn-chow" class="btn btn-action hidden" onclick="claimAction('CHOW')">CHOW</button>
      <button id="btn-pung" class="btn btn-action hidden" onclick="claimAction('PUNG')">PUNG</button>
      <button id="btn-kong" class="btn btn-action hidden" onclick="claimAction('KONG')">KONG</button>
      <button id="btn-win" class="btn btn-win hidden" onclick="claimAction('HU')">HU</button>
    </div>

    <!-- Tangan Pribadi (Bawah) -->
    <footer id="seat-bottom" class="player-seat active-turn">
      <div class="player-info" id="label-bottom">Giliran Anda (Sentuh balok untuk buang)</div>
      <div id="player-hand" class="hand-grid"></div>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
