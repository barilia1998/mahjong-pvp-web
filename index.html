<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mahjong PvP Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Overlay Lobi Ruangan -->
  <div id="lobby-screen">
    <div class="lobby-card">
      <h2>Mahjong PvP</h2>
      <p class="lobby-desc">Pilih mode aturan sebelum bermain</p>

      <!-- Pilihan Mode Aturan -->
      <div class="mode-selector">
        <label class="mode-option">
          <input type="radio" name="rule-mode" value="HK" checked>
          <span>Hong Kong (Kasual)</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="rule-mode" value="RIICHI">
          <span>Riichi Mahjong (Jepang)</span>
        </label>
      </div>

      <div class="lobby-section">
        <button type="button" id="btn-create-room" class="btn btn-action w-100">BUAT RUANGAN</button>
      </div>

      <div class="lobby-divider"><span>ATAU</span></div>

      <div class="lobby-section">
        <input type="text" id="input-room-code" placeholder="4 DIGIT KODE" maxlength="4" autocomplete="off" />
        <button type="button" id="btn-join-room" class="btn btn-secondary w-100">GABUNG RUANGAN</button>
      </div>
    </div>
  </div>

  <!-- Meja Permainan -->
  <div id="game-table" style="display: none;">
    <!-- Header: Status, Kode Room, Mode, Timer -->
    <header id="header-bar">
      <div id="status-bar">Menghubungkan...</div>
      <div id="rule-badge" class="badge-mode">MODE: HK</div>
      <div id="room-badge" class="badge-room">ROOM: ----</div>
      <div id="turn-timer" class="timer-box"><span id="timer-count">15</span>s</div>
    </header>

    <!-- Lawan Atas (Pemain 3) -->
    <div id="seat-top" class="player-seat">
      <div class="player-info" id="label-top">Pemain 3 (25000)</div>
      <div id="melds-top" class="melds-container"></div>
      <div id="hand-top" class="opponent-hand horizontal-back"></div>
    </div>

    <!-- Area Meja Tengah -->
    <main id="middle-board">
      <!-- Lawan Kiri (Pemain 4) -->
      <div id="seat-left" class="player-seat side-seat">
        <div class="player-info" id="label-left">P4<br>(25k)</div>
        <div id="melds-left" class="melds-container vertical"></div>
        <div id="hand-left" class="opponent-hand vertical-back"></div>
      </div>

      <!-- Area Kolam Buangan & Indikator Dora -->
      <div id="discard-pond">
        <div id="dora-bar" class="dora-box hidden">
          <span>DORA:</span>
          <div id="dora-tile" class="tile discarded dora-highlight">🀇 1W</div>
        </div>
        <div class="section-title">Area Buangan</div>
        <div id="discard-tiles" class="discard-grid"></div>
      </div>

      <!-- Lawan Kanan (Pemain 2) -->
      <div id="seat-right" class="player-seat side-seat">
        <div class="player-info" id="label-right">P2<br>(25k)</div>
        <div id="melds-right" class="melds-container vertical"></div>
        <div id="hand-right" class="opponent-hand vertical-back"></div>
      </div>
    </main>

    <!-- Tombol Aksi Permainan -->
    <div id="action-controls">
      <button type="button" id="btn-sort" class="btn btn-secondary">URUTKAN</button>
      <button type="button" id="btn-riichi" class="btn btn-riichi hidden">RIICHI</button>
      <button type="button" id="btn-chow" class="btn btn-action hidden">CHOW</button>
      <button type="button" id="btn-pung" class="btn btn-action hidden">PUNG</button>
      <button type="button" id="btn-kong" class="btn btn-action hidden">KONG</button>
      <button type="button" id="btn-win" class="btn btn-win hidden">HU</button>
    </div>

    <!-- Tangan Pribadi Bawah -->
    <footer id="seat-bottom" class="player-seat active-turn">
      <div class="bottom-header">
        <span class="player-info" id="label-bottom">Anda (25000)</span>
        <div id="melds-bottom" class="melds-container"></div>
      </div>
      <div id="player-hand" class="hand-grid"></div>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
